<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Translator & Grammar AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .translator-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 1000px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 768px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .box {
      background: #0f172a;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 320px;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 18px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #64748b;
    }

    .box-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
    }

    .speed-control input[type=range] {
      width: 80px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    .icon-btn.recording {
      background: #ef4444 !important;
      color: #fff !important;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .btn-translate {
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .alert-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 14px;
      color: #fbbf24;
    }

    .alert-box button {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: inline-block;
    }

    .hidden { display: none; }

    .output-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .translated-text {
      font-size: 20px;
      color: #f8fafc;
      font-weight: 500;
      margin-bottom: 20px;
      min-height: 40px;
    }

    .pronoun-text {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 500;
    }

    .status-bar {
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Smart Translator & Grammar AI</h1>
    <p>Voice Input • Advanced Grammar Check • Speed Control • Accurate Pronunciation</p>
  </div>

  <div class="translator-card">
    <div class="card-body">
      
      <!-- Input Section -->
      <div class="box">
        <textarea id="inputText" placeholder="Type or click microphone to speak English..."></textarea>
        
        <div class="box-footer">
          <div class="speed-control">
            <span><i class="fa-solid fa-gauge-high"></i> Speed:</span>
            <input type="range" id="speechSpeed" min="0.5" max="2" value="1" step="0.1" oninput="updateSpeedLabel(this.value)">
            <span id="speedVal">1x</span>
          </div>

          <div class="controls-row">
            <div class="action-btns">
              <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
              </button>
              <button class="icon-btn" onclick="speakEnglish()" title="Listen English">
                <i class="fa-solid fa-volume-high"></i>
              </button>
            </div>
            <button class="btn-translate" onclick="processText()">Translate</button>
          </div>
        </div>
      </div>

      <!-- Output Section -->
      <div class="box">
        <div>
          <div id="grammarAlert" class="alert-box hidden">
            <div><strong><i class="fa-solid fa-wand-magic-sparkles"></i> Corrected Sentence:</strong></div>
            <div id="suggestedText" style="margin-top: 4px; font-size: 15px; color: #fff;"></div>
            <button onclick="applyGrammarCorrection()">Apply Suggestion</button>
          </div>

          <div class="output-section">
            <h4>BENGALI TRANSLATION (অর্থ)</h4>
            <div id="banglaText" class="translated-text">...</div>
            
            <h4>ENGLISH PRONUNCIATION IN BANGLA (ইংরেজি উচ্চারণ)</h4>
            <div id="pronunciationText" class="pronoun-text">...</div>
          </div>
        </div>

        <div class="box-footer">
          <div class="controls-row">
            <div class="action-btns">
              <button class="icon-btn" onclick="speakBangla()" title="Listen Bengali">
                <i class="fa-solid fa-volume-high"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="status" class="status-bar"></div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const inputText = document.getElementById('inputText');
    const status = document.getElementById('status');
    let recognition;
    let latestCorrection = "";

    function updateSpeedLabel(val) {
      document.getElementById('speedVal').innerText = val + 'x';
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          micBtn.classList.add('recording');
          status.style.color = '#38bdf8';
          status.innerText = "Listening... Speak into your mic.";
        };

        recognition.onresult = function(event) {
          let currentTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            currentTranscript += event.results[i][0].transcript;
          }
          inputText.value = currentTranscript;
          if (event.results[0].isFinal) {
            processText();
          }
        };

        recognition.onerror = function(event) {
          micBtn.classList.remove('recording');
          status.style.color = '#f87171';
          if(event.error === 'not-allowed') {
            status.innerText = "Microphone blocked. Allow mic permission in browser settings.";
          } else {
            status.innerText = "Voice input stopped.";
          }
        };

        recognition.onend = function() {
          micBtn.classList.remove('recording');
        };
      }
    }

    initSpeech();

    function toggleVoiceInput() {
      if (!recognition) {
        status.style.color = '#f87171';
        status.innerText = "Speech Recognition not supported in this browser. Please use Chrome.";
        return;
      }

      try {
        if (micBtn.classList.contains('recording')) {
          recognition.stop();
        } else {
          recognition.start();
        }
      } catch (e) {
        recognition.stop();
      }
    }

    function speakEnglish() {
      const text = inputText.value.trim();
      if (!text) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(document.getElementById('speechSpeed').value);
      window.speechSynthesis.speak(utterance);
    }

    function speakBangla() {
      const text = document.getElementById('banglaText').innerText;
      if (!text || text === '...') return;

      const speed = document.getElementById('speechSpeed').value;
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=bn&client=tw-ob&ttsspeed=${speed < 1 ? 0.5 : 1}`;
      
      const audio = new Audio(url);
      audio.play().catch(e => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'bn-BD';
        utterance.rate = parseFloat(speed);
        window.speechSynthesis.speak(utterance);
      });
    }

    async function processText() {
      const text = inputText.value.trim();
      if (!text) return;

      status.style.color = '#38bdf8';
      status.innerText = "Processing...";

      try {
        await checkGrammar(text);
        await translateAndPronounce(text);
        status.innerText = "";
      } catch (err) {
        console.error(err);
        status.innerText = "Error processing translation.";
      }
    }

    async function checkGrammar(text) {
      const grammarAlert = document.getElementById('grammarAlert');
      const suggestedText = document.getElementById('suggestedText');

      try {
        let formattedText = text;
        
        formattedText = formattedText.replace(/(\b\w+\b)\s+as\s+well\s+(as\s+)?(\b\w+\b|\bI\b)\s+(has|have|were|are)/gi, function(match, p1, p2, p3, verb) {
          if (['were', 'have', 'are'].includes(verb.toLowerCase())) {
            return `${p1} as well as ${p3} was`;
          }
          return `${p1} as well as ${p3} ${verb}`;
        });

        const response = await fetch(`https://api.languagetool.org/v2/check?text=${encodeURIComponent(formattedText)}&language=en-US`);
        const data = await response.json();

        let corrected = formattedText;
        if (data.matches && data.matches.length > 0) {
          let offsetAdjustment = 0;

          data.matches.forEach(match => {
            if (match.replacements && match.replacements.length > 0) {
              const replacement = match.replacements[0].value;
              const start = match.offset + offsetAdjustment;
              const end = start + match.length;
              
              corrected = corrected.slice(0, start) + replacement + corrected.slice(end);
              offsetAdjustment += replacement.length - match.length;
            }
          });
        }

        if (corrected.toLowerCase() !== text.toLowerCase()) {
          latestCorrection = corrected;
          suggestedText.innerText = corrected;
          grammarAlert.classList.remove('hidden');
        } else {
          grammarAlert.classList.add('hidden');
        }
      } catch (e) {
        grammarAlert.classList.add('hidden');
      }
    }

    function applyGrammarCorrection() {
      if (latestCorrection) {
        inputText.value = latestCorrection;
        document.getElementById('grammarAlert').classList.add('hidden');
        processText();
      }
    }

    async function translateAndPronounce(text) {
      const banglaText = document.getElementById('banglaText');
      const pronunciationText = document.getElementById('pronunciationText');

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        
        let translated = "";
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) translated += item[0];
          });
        }

        banglaText.innerText = translated || "Translation unavailable";
        pronunciationText.innerText = getAccurateBanglaPronunciation(text);

      } catch (err) {
        console.error(err);
        banglaText.innerText = "Error in translation";
        pronunciationText.innerText = getAccurateBanglaPronunciation(text);
      }
    }

    // Accurate English to Bangla Pronunciation Generator
    function getAccurateBanglaPronunciation(text) {
      const dictionary = {
        "my": "মাই", "parents": "প্যারেন্টস", "as": "অ্যাজ", "well": "ওয়েল",
        "i": "আই", "was": "ওয়াজ", "present": "প্রেজেন্ট", "there": "দেয়ার",
        "the": "দ্যা", "a": "এ", "an": "অ্যান", "is": "ইজ", "are": "আর",
        "am": "অ্যাম", "were": "ওয়্যার", "has": "হ্যাজ", "have": "হ্যাভ",
        "had": "হ্যাড", "you": "ইউ", "he": "হি", "she": "শি", "we": "উই",
        "they": "দে", "this": "দিস", "that": "দ্যাট", "what": "হোয়াট",
        "where": "হোয়ার", "when": "হোয়েন", "why": "হোয়াই", "how": "হাউ"
      };

      const words = text.toLowerCase().match(/\b\w+\b/g);
      if (!words) return "...";

      return words.map(word => {
        if (dictionary[word]) {
          return dictionary[word];
        }
        return phoneticFallback(word);
      }).join(' ');
    }

    function phoneticFallback(word) {
      const map = {
        'sh': 'শ', 'ch': 'চ', 'th': 'থ', 'ph': 'ফ', 'gh': 'ঘ', 'kh': 'খ', 'dh': 'ধ',
        'a': 'অ্যা', 'e': 'ই', 'i': 'আই', 'o': 'ও', 'u': 'আ', 'b': 'ব', 'c': 'ক', 'd': 'ড',
        'f': 'ফ', 'g': 'গ', 'h': 'হ', 'j': 'জ', 'k': 'ক', 'l': 'ল', 'm': 'ম', 'n': 'ন',
        'p': 'প', 'q': 'ক', 'r': 'র', 's': 'স', 't': 'ট', 'v': 'ভ', 'w': 'ওয়', 'x': 'ক্স',
        'y': 'ওয়াই', 'z': 'জ'
      };

      let str = word;
      for (let key in map) {
        str = str.replaceAll(key, map[key]);
      }
      return str;
    }
  </script>

</body>
</html>
