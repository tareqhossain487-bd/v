<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Translator & Grammar AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .translator-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 1000px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 768px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .box {
      background: #0f172a;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 18px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #64748b;
    }

    .box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    .icon-btn.recording {
      background: #ef4444 !important;
      color: #fff !important;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .btn-translate {
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .alert-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 14px;
      color: #fbbf24;
    }

    .hidden { display: none; }

    .output-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .translated-text {
      font-size: 20px;
      color: #f8fafc;
      font-weight: 500;
      margin-bottom: 20px;
      min-height: 40px;
    }

    .pronoun-text {
      font-size: 16px;
      color: #38bdf8;
      font-weight: 500;
      text-transform: capitalize;
    }

    .status-bar {
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Smart Translator & Grammar AI</h1>
    <p>Voice Input • Grammar Check • Bangla Pronunciation</p>
  </div>

  <div class="translator-card">
    <div class="card-body">
      
      <!-- Input Section -->
      <div class="box">
        <textarea id="inputText" placeholder="Type or click microphone to speak English..."></textarea>
        
        <div class="box-footer">
          <div class="action-btns">
            <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Input">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="icon-btn" onclick="speakText('inputText', 'en-US')" title="Listen Input">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <button class="btn-translate" onclick="processText()">Translate</button>
        </div>
      </div>

      <!-- Output Section -->
      <div class="box">
        <div>
          <div id="grammarAlert" class="alert-box hidden">
            <strong><i class="fa-solid fa-wand-magic-sparkles"></i> Grammar Suggestion:</strong>
            <span id="suggestedText"></span>
          </div>

          <div class="output-section">
            <h4>Bengali Translation</h4>
            <div id="banglaText" class="translated-text">...</div>
            
            <h4>Bangla Pronunciation (উচ্চারণ)</h4>
            <div id="pronunciationText" class="pronoun-text">...</div>
          </div>
        </div>

        <div class="box-footer">
          <div class="action-btns">
            <button class="icon-btn" onclick="speakText('banglaText', 'bn-BD')" title="Listen Bengali">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="status" class="status-bar"></div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const inputText = document.getElementById('inputText');
    const status = document.getElementById('status');
    let recognition;

    // Speech Recognition Initialization
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          micBtn.classList.add('recording');
          status.style.color = '#38bdf8';
          status.innerText = "Listening... Speak into your mic.";
        };

        recognition.onresult = function(event) {
          let currentTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            currentTranscript += event.results[i][0].transcript;
          }
          inputText.value = currentTranscript;
          if (event.results[0].isFinal) {
            processText();
          }
        };

        recognition.onerror = function(event) {
          micBtn.classList.remove('recording');
          status.style.color = '#f87171';
          if(event.error === 'not-allowed') {
            status.innerText = "Microphone blocked. Allow mic permission in browser settings.";
          } else {
            status.innerText = "Voice input stopped.";
          }
        };

        recognition.onend = function() {
          micBtn.classList.remove('recording');
        };
      }
    }

    initSpeech();

    function toggleVoiceInput() {
      if (!recognition) {
        status.style.color = '#f87171';
        status.innerText = "Speech Recognition not supported in this browser. Please use Chrome.";
        return;
      }

      try {
        if (micBtn.classList.contains('recording')) {
          recognition.stop();
        } else {
          recognition.start();
        }
      } catch (e) {
        recognition.stop();
      }
    }

    function speakText(elementId, lang) {
      const text = document.getElementById(elementId).innerText || document.getElementById(elementId).value;
      if (!text || text === '...') return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    async function processText() {
      const text = inputText.value.trim();
      if (!text) return;

      status.style.color = '#38bdf8';
      status.innerText = "Processing...";

      try {
        await checkGrammar(text);
        await translateAndPronounce(text);
        status.innerText = "";
      } catch (err) {
        console.error(err);
        status.innerText = "Error processing translation.";
      }
    }

    async function checkGrammar(text) {
      const grammarAlert = document.getElementById('grammarAlert');
      const suggestedText = document.getElementById('suggestedText');

      try {
        const response = await fetch(`https://api.languagetool.org/v2/check?text=${encodeURIComponent(text)}&language=en-US`);
        const data = await response.json();

        if (data.matches && data.matches.length > 0) {
          let corrected = text;
          let offsetAdjustment = 0;

          data.matches.forEach(match => {
            if (match.replacements && match.replacements.length > 0) {
              const replacement = match.replacements[0].value;
              const start = match.offset + offsetAdjustment;
              const end = start + match.length;
              
              corrected = corrected.slice(0, start) + replacement + corrected.slice(end);
              offsetAdjustment += replacement.length - match.length;
            }
          });

          if (corrected !== text) {
            suggestedText.innerText = corrected;
            grammarAlert.classList.remove('hidden');
          } else {
            grammarAlert.classList.add('hidden');
          }
        } else {
          grammarAlert.classList.add('hidden');
        }
      } catch (e) {
        grammarAlert.classList.add('hidden');
      }
    }

    async function translateAndPronounce(text) {
      const banglaText = document.getElementById('banglaText');
      const pronunciationText = document.getElementById('pronunciationText');

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        
        let translated = "";
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) translated += item[0];
          });
        }

        banglaText.innerText = translated || "Translation unavailable";

        if (translated) {
          pronunciationText.innerText = banglaToRoman(translated);
        } else {
          pronunciationText.innerText = "...";
        }
      } catch (err) {
        console.error(err);
        banglaText.innerText = "Error in translation";
        pronunciationText.innerText = "...";
      }
    }

    // Custom Bengali to Roman Phonetic Transliteration
    function banglaToRoman(text) {
      const charMap = {
        'অ': 'o', 'আ': 'a', 'ই': 'i', 'ঈ': 'i', 'উ': 'u', 'ঊ': 'u', 'ঋ': 'ri', 'এ': 'e', 'ঐ': 'oi', 'ও': 'o', 'ঔ': 'ou',
        'ক': 'k', 'খ': 'kh', 'গ': 'g', 'ঘ': 'gh', 'ঙ': 'ng',
        'চ': 'ch', 'ছ': 'chh', 'জ': 'j', 'ঝ': 'jh', 'ঞ': 'n',
        'ট': 't', 'ঠ': 'th', 'ড': 'd', 'ঢ': 'dh', 'ণ': 'n',
        'ত': 't', 'থ': 'th', 'দ': 'd', 'ধ': 'dh', 'ন': 'n',
        'প': 'p', 'ফ': 'f', 'ব': 'b', 'ভ': 'bh', 'ম': 'm',
        'য': 'j', 'র': 'r', 'ল': 'l', 'শ': 'sh', 'ষ': 'sh', 'স': 's', 'হ': 'h',
        'ড়': 'r', 'ঢ়': 'rh', 'য়': 'y', 'ৎ': 't', 'ং': 'ng', 'ঃ': 'h', 'ঁ': 'n',
        'া': 'a', 'ি': 'i', 'ী': 'i', 'ু': 'u', 'ূ': 'u', 'ৃ': 'ri', 'ে': 'e', 'ৈ': 'oi', 'ো': 'o', 'ৌ': 'ou', '্': ''
      };

      return text.split('').map(char => charMap[char] || char).join('');
    }
  </script>

</body>
</html>
